name: release

# Ships a signed APK and the daemon sdist to GitHub Releases when a v* tag is pushed:
#
#   git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0
#
# Signing material comes from repository secrets and is written to a file only inside the runner.
# Without those secrets the APK is built unsigned and the release is marked as such, so a fork can
# still run this workflow without failing. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        # A mismatch would ship an APK whose About screen disagrees with the release it came from.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, sys

          tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")

          props = pathlib.Path("android-app/gradle.properties").read_text(encoding="utf-8")
          app = re.search(r"^mpvbridge\.version=(.+)$", props, re.M).group(1).strip()

          init = pathlib.Path("daemon/src/mpvbridge/__init__.py").read_text(encoding="utf-8")
          daemon = re.search(r'__version__ = "([^"]+)"', init).group(1)

          if app != daemon:
              sys.exit(f"app {app} and daemon {daemon} disagree; they ship as one version")
          if tag and tag != app:
              sys.exit(f"tag v{tag} does not match version {app}")
          print(f"version={app}")
          PY

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret; the APK will be unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android-app
        env:
          MPVBRIDGE_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          MPVBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MPVBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MPVBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK after the release
        run: |
          mkdir -p artifacts
          cp android-app/app/build/outputs/apk/release/*.apk \
             "artifacts/mpvbridge-v${{ needs.verify.outputs.version }}.apk"

      - name: Confirm the APK is signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs \
            "artifacts/mpvbridge-v${{ needs.verify.outputs.version }}.apk"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build the daemon
        run: |
          pip install build
          python -m build --outdir "$GITHUB_WORKSPACE/artifacts"
        working-directory: daemon

      # A stable filename so the README's install line can point at /latest/download/.
      - name: Add a version-independent sdist name
        run: cp artifacts/mpvbridge-*.tar.gz artifacts/mpvbridge-py.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Take this version's section out of the changelog
        run: |
          python - <<'PY'
          import pathlib, re
          version = "${{ needs.verify.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "v${{ needs.verify.outputs.version }}" \
            --notes-file release-notes.md \
            --prerelease \
            artifacts/*.apk artifacts/*.tar.gz artifacts/*.whl
