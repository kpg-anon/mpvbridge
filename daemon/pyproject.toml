[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpvbridge"
dynamic = ["version"]
description = "Bridges mpv's JSON IPC socket in Termux to the mpvbridge companion app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kpganon" }]
dependencies = []

[project.scripts]
mpvbridge = "mpvbridge.__main__:main"

[project.urls]
Homepage = "https://github.com/kpg-anon/mpvbridge"
Changelog = "https://github.com/kpg-anon/mpvbridge/blob/main/CHANGELOG.md"

# One version for the daemon half, read straight out of the package.
[tool.hatch.version]
path = "src/mpvbridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mpvbridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
